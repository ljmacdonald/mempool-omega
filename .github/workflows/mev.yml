name: Arbitrage lab (MEV survival, shadow, hourly)

# SHADOW ONLY (DECISIONS D103). For about 8 minutes an hour: cross-venue round trips on Solana are priced with
# Jupiter quotes, opportunities are re-checked 1, 3, 10 and 30 seconds later, and the fee and Jito tip levels are
# read. No wallet, no keys, nothing is signed or sent.
run-name: "MEV lab: ${{ github.event.schedule || 'run' }}"
on:
  schedule:
    - cron: "48 * * * *"   # hourly (backup for the Tick job)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omega-mev-writer
  cancel-in-progress: false

jobs:
  mev:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: One shadow session
        run: python -m mev.shadow
      - name: Publish the snapshot for the website (data branch)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash infra/publish_data.sh .cache/mev_out/snapshot.json mev/snapshot.json
      - name: Commit state (opportunities and sessions)
        if: always()
        run: bash infra/commit_state.sh "mev shadow $(date -u +%Y-%m-%dT%H%MZ)"
