name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["state/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMEGA_DATA_MODE: synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,stream]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest
      - name: Offline smoke test (synthetic end-to-end)
        run: OMEGA_STATE_DIR=$RUNNER_TEMP/omega python -m scripts.demo --quick --no-charts
