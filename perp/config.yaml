# Perp DEX lab settings (D123). Thresholds are the two specifications' defaults, fixed before any result.
# Venue fee and cost figures here are only used when the venue doesn't publish them; each carries its source.
version: 1
account:
  start_usd: 100            # the paper account (ANEE): split equally between the four strategies
  reference_usd: 10000      # the same strategies on a $10,000 account, shown beside it to separate edge from small-account costs
  sleeves: {lp: 0.25, carry: 0.25, spread: 0.25, directional: 0.25}

risk:                       # ANEE section 10 (stricter of the two specifications where they differ)
  max_loss_per_position: 0.005
  max_daily_loss: 0.02
  max_drawdown: 0.10
  max_margin_share: 0.20    # of the account; the LP strategy holds pool tokens instead (no margin)
  max_leverage: 2.0
  max_pool_share: 0.01      # a position may be at most 1% of the GMX market's available liquidity
  min_liquidation_distance: 0.25
  max_hedge_mismatch: 0.02
  stale_oracle_s: 300
  depeg: 0.01

markets: [ETH, BTC, SOL, ARB, LINK, DOGE]   # GMX v2 Arbitrum markets with index token = these, USDC-backed or self-backed

costs:
  safety_multiplier: 1.5    # expected edge must exceed total cost x this
  adverse_multiplier: 2.0   # adverse estimate: every cost x2 (ANEE gate 5)
  extreme_multiplier: 4.0
  arbitrum_tx_usd: 0.02     # user transaction gas on Arbitrum (assumption, labelled uncalibrated)
  hyperliquid:              # Hyperliquid documented base tier (https://hyperliquid.gitbook.io/hyperliquid-docs/trading/fees)
    taker: 0.00045
    maker: 0.00015
    source: "Hyperliquid fee docs, base tier, checked 2026-10-22"

lp:                         # Multi-strategy spec, strategy 1
  rebalance_days: 1         # the specification says every 6 h; the free history is daily
  top_n: 3
  max_pool_share_of_sleeve: 0.5
  min_history_days: 60
  exit_trader_win_days: 3
  min_pool_usd: 1000000

carry:                      # strategy 2
  enter_annual: 0.15
  exit_annual: 0.03
  hold_hours: 72
  confirm_hours: 3
  flip_hours: 2

spread:                     # strategy 3
  window_days: 7
  enter_z: 2.5
  exit_z: 0.5
  stop_z: 4.0
  max_hours: 24
  cost_multiple: 2.0

directional:                # strategy 4
  ema: 50
  breakout: 20
  atr: 14
  atr_floor_pct: 0.20
  atr_floor_window: 720     # hours of ATR history the bottom-20% filter compares against
  stop_atr: 1.5
  take_atr: 3.0
  trail_atr: 2.0
  mr_sigma: 2.5
  mr_vwap_bars: 16          # 4 h of 15-minute bars
  flat_slope_atr: 0.5       # 1 h trend "flat": EMA50 moved less than 0.5 ATR over 10 hours
  oi_crowded: 0.70

gates:                      # ANEE section 9
  data_complete: 0.995
  min_trades: 500
  max_drawdown: 0.10
  stress_cost_multiple: 2.0
  shadow_days: 30
  shadow_trades: 100
  shadow_cost_ok: 0.95
  bootstrap_block: 10
  bootstrap_reps: 2000
